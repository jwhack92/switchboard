name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 is pinned for the reason build.yml gives.
        os: [windows-2022, ubuntu-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    env:
      # Lets test/schedule-dst.test.js run; it skips where the zone has no
      # 2026-11-01 fall-back. SWITCHBOARD_DATA_DIR is not set: tests set their own.
      TZ: America/Los_Angeles

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install setuptools (node-gyp distutils fix)
        run: python -m pip install setuptools

      # No --ignore-scripts: postinstall rebuilds better-sqlite3 for Electron,
      # and several tests run it under ELECTRON_RUN_AS_NODE.
      - name: Install dependencies
        run: npm ci

      - name: Full suite
        run: npm test
